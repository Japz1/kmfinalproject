<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Baca artikel pengetahuan beasiswa secara lengkap." />
  <meta name="theme-color" content="#001242" />
  <title>Detail Artikel — Beasiswa Knowledge Base</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js?v=3"></script>
</head>
<body class="bg-paper font-sans text-ink antialiased">

<!-- NAVBAR -->
<header id="navbar" class="sticky top-0 z-50 border-b border-line/90 bg-white/90 backdrop-blur-md"></header>

<!-- ARTICLE HEADER (compact) -->
<div class="relative overflow-hidden py-5 text-white">
  <div class="absolute inset-0 bg-[linear-gradient(135deg,#000022_0%,#001242_48%,#005E7C_100%)]" aria-hidden="true"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_15%_20%,rgba(0,148,198,0.18),transparent_30%)]" aria-hidden="true"></div>
  <div class="container relative">
    <nav id="breadcrumb" class="flex flex-wrap items-center gap-2 text-[0.8125rem] text-white/70" aria-label="Breadcrumb">
      <!-- injected by detail.js -->
    </nav>
  </div>
</div>

<!-- DETAIL LAYOUT -->
<div class="container">
  <div class="grid items-start gap-8 py-10 lg:grid-cols-[minmax(0,1fr)_320px]">

    <!-- Main article -->
    <main id="detailMain" class="min-w-0">
      <!-- injected by detail.js -->
    </main>

    <!-- Sidebar -->
    <aside id="detailSidebar" class="flex min-w-0 flex-col gap-4">
      <!-- injected by detail.js -->
    </aside>

  </div>
</div>

<!-- FOOTER -->
<footer id="footer" class="mt-16 bg-primary-dark text-white shadow-[inset_0_4px_0_#0094C6]"></footer>

<script src="assets/js/app.js?v=3"></script>
<script src="assets/js/detail.js?v=2"></script>
</body>
</html>
